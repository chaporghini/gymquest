# Baut GYMQUEST als Web-App und veröffentlicht sie auf GitHub Pages.
# Läuft bei jedem Push auf main und lässt sich unter "Actions" auch von Hand starten.
#
# Einmalig einrichten (siehe ANLEITUNG.md):
#   Settings → Pages → Source: "GitHub Actions"
#   Settings → Secrets and variables → Actions → Variables:
#     SUPABASE_URL  = Project URL aus Supabase
#     SUPABASE_KEY  = Publishable key (oder anon key) aus Supabase
name: Web-App veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      - name: Supabase-Zugang prüfen
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "::warning::SUPABASE_URL oder SUPABASE_KEY fehlt, die App läuft ohne Konto."; exit 0; fi
          case "$KEY" in sb_secret_*) echo "::error::SUPABASE_KEY ist ein Secret Key. Bitte den Publishable Key eintragen."; exit 1;; esac
          kind=other; case "$KEY" in sb_publishable_*) kind=publishable;; eyJ*) kind=legacy-anon;; esac
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $KEY" "${URL%/}/auth/v1/settings")
          echo "::notice::Supabase-Key: Typ $kind, Länge ${#KEY}, Antwort von Supabase: $code"
          if [ "$code" != "200" ]; then echo "::error::Supabase lehnt SUPABASE_KEY ab (HTTP $code). Bitte den Publishable Key unter Project Settings → API Keys neu kopieren und als Variable SUPABASE_KEY speichern."; exit 1; fi
      - name: Web-App bauen
        run: npm run build:web
        env:
          # Repository "gymquest" → https://<name>.github.io/gymquest/
          GYMQUEST_BASE_URL: ${{ endsWith(github.event.repository.name, '.github.io') && '' || format('/{0}', github.event.repository.name) }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
